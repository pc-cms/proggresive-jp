services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: progressive
      POSTGRES_USER: progressive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U progressive -d progressive']
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://progressive:${POSTGRES_PASSWORD}@db:5432/progressive
      REQUIRE_TLS: '1'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 15
  tls:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '${PROGRESSIVE_HTTPS_PORT:-8443}:443'
    environment:
      PROGRESSIVE_HOST: ${PROGRESSIVE_HOST:?Set local DNS hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  database:
  tls_data:
  tls_config:
